[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_port = COM11
monitor_port = COM11
build_flags = -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_filter = test_core
build_flags = -Iinclude
